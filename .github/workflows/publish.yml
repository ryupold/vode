name: Publish release to NPM, GitHub & Chimps Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-test:
    name: Verify Release and Run Tests
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Verify tag and package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${RELEASE_TAG#v}"

          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match package version ${PACKAGE_VERSION}."
            exit 1
          fi

          git fetch --no-tags origin main

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag ${RELEASE_TAG} is not based on the main branch."
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run clean
      - run: npm run build
      - run: npm run test:package

      - name: Verify committed release artifacts
        shell: bash
        run: |
          git diff --exit-code -- dist

          if [[ -n "$(git status --porcelain --untracked-files=all -- dist)" ]]; then
            git status --short --untracked-files=all -- dist
            echo "The build produced uncommitted files in dist."
            exit 1
          fi

  publish-to-npm:
    name: Publish to NPM
    needs: verify-and-test
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run clean
      - run: npm run build

      - name: Publish package
        run: npm publish --ignore-scripts --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-to-github:
    name: Publish to GitHub Packages
    needs: verify-and-test
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@ryupold"
          cache: npm

      - run: npm ci
      - run: npm run clean
      - run: npm run build

      - name: Publish package
        run: npm publish --ignore-scripts --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-to-chimps:
    name: Publish to Chimps Packages
    needs: verify-and-test
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run clean
      - run: npm run build

      - name: Publish package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CHIMPS_TOKEN }}
        run: |
          set -euo pipefail
          trap 'rm -f .npmrc' EXIT

          printf '%s\n' \
            '@ryupold:registry=https://git.chimps.quest/api/packages/ryupold/npm/' \
            '//git.chimps.quest/api/packages/ryupold/npm/:_authToken=${NODE_AUTH_TOKEN}' \
            > .npmrc

          npm publish --ignore-scripts --access public
